# Configuración para pruebas con H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuración JWT específica para pruebas
JWT_KEY_DIRECTORY=config/test_keys
JWT_ISSUER=asist.io-test
JWT_AUDIENCE=asist.io-client-test
JWT_ACCESS_TOKEN_EXPIRATION=60

# Deshabilitar correos en pruebas
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

# Configuración de Redis para pruebas
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Usar embedded Redis para pruebas unitarias
spring.data.redis.embedded=true